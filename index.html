<title>SuperPiky Geek Store</title>

/* Layout concept: comic-panel storefront. A teal halftone masthead carries an outlined orange wordmark (echoing the SP logo),
   products sit in inked "panels" with hard offset shadows, and the cart slides in as a sheet from the right. */
:root{
  --bg:#EEF5F5; --surface:#FFFFFF; --surface-2:#DCEBEB;
  --fg:#12181B; --muted:#475B5F;
  --line:#12181B; --field-line:#12181B; --shadow:#12181B; --outline:#12181B;
  --brand:#0A7C83; --brand-fg:#FFFFFF;
  --accent:#F6A21A; --accent-fg:#12181B;
  --pop:#C42A62; --pop-fg:#FFFFFF;
  --photo-bg:#FFFFFF; --focus:#0A7C83;
  --font-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1416; --surface:#142326; --surface-2:#1C3236;
    --fg:#E7F3F3; --muted:#9FB7BA;
    --line:#3E666C; --field-line:#6F9399; --shadow:#000000; --outline:#12181B;
    --brand:#0B5E64; --brand-fg:#FFFFFF;
    --accent:#FFB02E; --accent-fg:#12181B;
    --pop:#FF7AA2; --pop-fg:#12181B;
    --photo-bg:#FFFFFF; --focus:#FFB02E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1416; --surface:#142326; --surface-2:#1C3236;
  --fg:#E7F3F3; --muted:#9FB7BA;
  --line:#3E666C; --field-line:#6F9399; --shadow:#000000; --outline:#12181B;
  --brand:#0B5E64; --brand-fg:#FFFFFF;
  --accent:#FFB02E; --accent-fg:#12181B;
  --pop:#FF7AA2; --pop-fg:#12181B;
  --photo-bg:#FFFFFF; --focus:#FFB02E;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:100%;max-width:1160px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;
  font:400 1.05rem/1.1 var(--font-display);letter-spacing:.02em;text-decoration:none;text-align:center;
  background:var(--accent);color:var(--accent-fg);border:3px solid var(--outline);border-radius:10px;
  box-shadow:4px 4px 0 var(--shadow);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--shadow)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn.alt{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.92rem}
.btn.danger{background:var(--pop);color:var(--pop-fg)}
.btn.wa{background:#25D366;color:#0B1F14;width:100%;min-height:54px;font-size:1.2rem}
.btn:focus-within{outline:3px solid var(--focus);outline-offset:2px}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;background:var(--surface);border:2px solid var(--field-line);border-radius:10px}
textarea{resize:vertical;min-height:72px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
.field{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:.85rem;min-width:0}
.field .hint{font-weight:600;color:var(--muted);font-size:.8rem}
.hint{color:var(--muted);font-size:.85rem}

/* Masthead */
.top{background-color:var(--brand);background-image:radial-gradient(rgba(255,255,255,.16) 1.6px,transparent 1.9px);background-size:14px 14px;color:var(--brand-fg);border-bottom:4px solid var(--line)}
.top-in{display:flex;align-items:center;gap:18px;padding-block:22px 14px}

  box-shadow:0 0 0 4px var(--outline),6px 6px 0 var(--shadow)}
.top-txt{min-width:0}
.jp{font-weight:800;letter-spacing:.32em;font-size:.78rem;margin-bottom:4px}
.mark{font:400 clamp(2.4rem,9vw,4.4rem)/.95 var(--font-display);color:var(--accent);-webkit-text-stroke:6px var(--outline);paint-order:stroke fill;
  text-shadow:4px 4px 0 var(--outline);transform:rotate(-2deg);transform-origin:left center;overflow-wrap:anywhere}
.tag{margin-top:8px;font-weight:800}
.top-act{margin-left:auto;align-self:flex-start;padding-top:2px}
.facts{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-block:0;padding-top:0;padding-bottom:18px}
.facts li{background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.85rem;box-shadow:3px 3px 0 var(--shadow)}

/* Sticky bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
.bar-in{display:flex;gap:10px;align-items:center;padding-block:10px}
.search{flex:1;min-width:0}
.cartbtn{flex:none}
.count{display:inline-block;min-width:26px;padding:0 8px;line-height:24px;border-radius:999px;background:var(--pop);color:var(--pop-fg);border:2px solid var(--outline);font:800 .85rem/24px var(--font-body);text-align:center}

/* Catalog */
.main{padding-block:16px 8px}
.ratebar{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:10px 14px;background:var(--surface-2);border:2px dashed var(--line);border-radius:10px;font-weight:700}
.rate-k{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rate-d{color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-block:16px 4px}
.chip{min-height:38px;padding:4px 14px;border:2px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);font-weight:800;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.sec-h{font:400 1.8rem/1.1 var(--font-display);margin-block:18px 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;text-wrap:balance}
.sec-h small{font:700 .95rem var(--font-body);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:18px 16px;padding-bottom:10px}
@media (min-width:720px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px 22px}}
.card{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:3px solid var(--line);border-radius:12px;box-shadow:6px 6px 0 var(--shadow);overflow:hidden}
.ph{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--photo-bg);border-bottom:3px solid var(--line)}
.ph img{display:block;width:100%;height:100%;object-fit:contain}
.badge{position:absolute;top:8px;left:8px;padding:2px 10px;border:2px solid var(--outline);border-radius:6px;background:var(--pop);color:var(--pop-fg);font:400 .9rem/1.4 var(--font-display);transform:rotate(-4deg)}
.badge.ex{background:var(--accent);color:var(--accent-fg);left:auto;right:8px}
.card.out .ph img{opacity:.4;filter:grayscale(1)}
.out-tag{position:absolute;inset:0;display:grid;place-items:center}
.out-tag span{padding:4px 16px;background:var(--fg);color:var(--bg);font:400 1.4rem/1.2 var(--font-display);border:3px solid var(--outline);transform:rotate(-6deg);box-shadow:4px 4px 0 var(--shadow)}
.cb{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;padding:12px}
.cat{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.cb h3{font:800 1rem/1.25 var(--font-body);overflow-wrap:anywhere;text-wrap:balance}
.desc{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.price{display:flex;flex-direction:column;margin-top:4px}
.usd{font:400 1.7rem/1.05 var(--font-display);font-variant-numeric:tabular-nums}
.bs{font-weight:700;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stock{font-size:.8rem;font-weight:700;color:var(--muted)}
.stock.low{color:var(--pop)}
.buy{margin-top:auto;padding-top:8px}
.buy .btn{width:100%}
.step{display:inline-flex;align-items:center;border:3px solid var(--outline);border-radius:10px;background:var(--surface);box-shadow:3px 3px 0 var(--shadow);overflow:hidden}
.step button{width:42px;height:40px;border:0;background:var(--accent);color:var(--accent-fg);font:400 1.4rem/1 var(--font-display);cursor:pointer}
.step button[disabled]{opacity:.45;cursor:not-allowed}
.step output{min-width:40px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.empty{padding:28px 8px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty-t{font:400 1.5rem var(--font-display)}
.empty p{max-width:36ch;color:var(--muted)}
.foot{margin-top:36px;background:var(--surface-2);border-top:4px solid var(--line)}
.foot-in{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;padding-block:22px 28px;font-size:.9rem}
.foot a{color:var(--fg);font-weight:800}

/* Cart drawer */
.drawer{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(7,13,15,.62)}
.panel{display:flex;flex-direction:column;width:min(440px,100%);height:100%;background:var(--bg);border-left:4px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:2px solid var(--line)}
.panel-head h2{font:400 1.6rem var(--font-display)}
.x{width:44px;height:44px;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-size:1.6rem;line-height:1;cursor:pointer}
.panel-body{flex:1;overflow-y:auto;padding-top:8px;padding-bottom:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.item{display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px;padding-block:14px;border-bottom:2px dashed var(--line)}
.item .th{width:60px;height:60px;background:var(--photo-bg);border:2px solid var(--line);border-radius:8px;overflow:hidden}
.item .th img{width:100%;height:100%;object-fit:contain;display:block}
.item h3{font:800 .95rem/1.25 var(--font-body);overflow-wrap:anywhere}
.unit{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.item-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:8px}
.rm{background:none;border:0;padding:6px 2px;color:var(--pop);font-weight:800;text-decoration:underline;cursor:pointer}
.line-t{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.line-t b{display:block;font-weight:800}
.line-t span{font-size:.82rem;color:var(--muted)}
.totals{margin-block:16px;padding:12px 14px;background:var(--surface);border:3px solid var(--line);border-radius:12px;box-shadow:5px 5px 0 var(--shadow)}
.trow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.trow span{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;color:var(--muted)}
.trow strong{font:400 1.9rem/1.15 var(--font-display);font-variant-numeric:tabular-nums;text-align:right}
.trow.bs strong{font-size:1.55rem}
.order{display:grid;gap:12px;margin-bottom:16px}
.cta-note{margin-top:10px;text-align:center}
.link-clear{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer}

/* Owner panel */
.admin-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding-block:22px}
.admin-head h1{font:400 clamp(1.9rem,6vw,2.8rem)/1 var(--font-display);color:var(--accent);-webkit-text-stroke:5px var(--outline);paint-order:stroke fill;text-shadow:3px 3px 0 var(--outline)}
.admin-head p{margin-top:8px;max-width:60ch;font-weight:700}
.box{margin-block:20px;padding:16px;background:var(--surface);border:3px solid var(--line);border-radius:12px;box-shadow:6px 6px 0 var(--shadow)}
.box h2{font:400 1.5rem/1.1 var(--font-display);margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.wide{grid-column:1/-1}
.err{min-height:1.4em;color:var(--pop);font-weight:800;margin-top:8px}
.new-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:4px}
.thumb{width:72px;height:72px;background:var(--photo-bg);border:2px solid var(--line);border-radius:8px;object-fit:contain}
.notice{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface-2);border:2px dashed var(--line);border-radius:10px;font-weight:700;margin-bottom:8px}
.prow{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;padding-block:16px;border-top:2px dashed var(--line)}
.pimg{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.pimg img{width:104px;height:104px;object-fit:contain;background:var(--photo-bg);border:2px solid var(--line);border-radius:8px}
.pf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pf .wide{grid-column:1/-1}
.bsp{font-size:.82rem;color:var(--muted);font-weight:700;min-height:1.2em}
.pact{grid-column:1/-1;display:flex;justify-content:flex-end}
.savebar{position:sticky;bottom:0;z-index:25;background:var(--bg);border-top:4px solid var(--line)}
.savebar .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.save-msg{display:flex;align-items:center;gap:10px;font-weight:800;min-width:0;flex:1 1 260px}
.dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--brand);border:2px solid var(--outline)}
.dot.dirty{background:var(--pop)}
.save-btns{display:flex;gap:10px;flex-wrap:wrap}
.locked{padding-block:48px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.locked h2{font:400 1.8rem var(--font-display)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100% - 32px);
  padding:10px 16px;background:var(--fg);color:var(--bg);font-weight:800;border-radius:10px;box-shadow:4px 4px 0 var(--shadow)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script id="app-js">
(function(){
'use strict';

/* ---------- helpers ---------- */

var clone=function(o){return JSON.parse(JSON.stringify(o))};
var round2=function(n){return Math.round((n+Number.EPSILON)*100)/100};

function normPhone(v){var d=String(v||'').replace(/\D/g,'');if(d.indexOf('00')===0)d=d.slice(2);if(d.charAt(0)==='0')d='58'+d.slice(1);else if(d.length===10&&d.charAt(0)==='4')d='58'+d;return d}

function art(p){
  var pal=[['#0A7C83','#F6A21A'],['#F6A21A','#12181B'],['#C42A62','#FFE3EC'],['#2B6CB0','#F6A21A'],['#12181B','#2EC4CB'],['#6B46C1','#F6A21A']];

  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);

/* ---------- cart ---------- */
function cartItems(){
  var out=[];
  Object.keys(cart).forEach(function(id){var p=find(id);if(p&&p.stock>0){var q=Math.min(+cart[id]||0,p.stock);if(q>0)out.push({p:p,q:q})}});

  var items=cartItems(),r=rate(),L=['Hola SuperPiky, quiero hacer este pedido:',''];
  items.forEach(function(it){
    var line=round2(it.p.price*it.q);
    L.push(it.q+' x '+it.p.name+' ('+usd(it.p.price)+' c/u) = '+usd(line)+(r?' / '+bsf(round2(line*r)):''));

  if(p.stock<=0)return '<p class="stock">Sin unidades</p>';
  if(p.stock===1)return '<p class="stock low">Última unidad</p>';
  if(p.stock<=5)return '<p class="stock low">Quedan '+p.stock+'</p>';
  return '<p class="stock">'+p.stock+' disponibles</p>';
}

  var out=p.stock<=0,q=cart[p.id]?Math.min(cart[p.id],p.stock):0;
  return '<article class="card'+(out?' out':'')+'">'

}

   +'<button class="btn alt" data-act="discard"'+(!dirty||busy?' disabled':'')+'>'+(armed==='discard'?'Confirmar: descartar':'Descartar')+'</button>'
   +'<button class="btn" data-act="pub"'+(!dirty||busy||!artifactNS?' disabled':'')+'>Publicar cambios</button></div></div>'
   +(artifactNS?'':'<div class="wrap hint" style="padding-bottom:8px">Desde esta vista no se puede publicar. Abre el enlace de la tienda con tu cuenta.</div>');
}
function updateSavebar(){var s=$('#savebar');if(s)s.innerHTML=savebarHTML()}
function markDirty(){dirty=true;updateSavebar()}

  $('#app').innerHTML=head
   +'<main class="wrap">'

   +'<label class="field" for="nw-stock">Cantidad disponible<input id="nw-stock" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label>'
   +'<label class="field wide" for="nw-desc">Descripción corta (opcional)<input id="nw-desc" maxlength="140"></label>'
   +'</div><div class="new-row"><img class="thumb" id="nw-thumb" alt="" hidden><label class="btn alt sm">Elegir foto<input class="sr" type="file" id="nw-photo" accept="image/*" data-photo="new"></label>'
   +'<button class="btn" data-act="add-product">Agregar producto</button></div><p class="err" id="nw-err" role="alert"></p></section>'
   +'<section class="box"><h2>Tus productos (<span id="pcount">0</span>)</h2><div id="ex-notice"></div><div id="plist"></div></section>'

function fileToDataUrl(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=rej;
    fr.onload=function(){
      var img=new Image();
      img.onerror=rej;
      img.onload=function(){
        var s=Math.min(1,800/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s));
        var c=document.createElement('canvas');c.width=w;c.height=h;
        var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',0.8));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function addProduct(){
  var name=$('#nw-name').value.trim(),price=parseFloat($('#nw-price').value),stock=parseInt($('#nw-stock').value,10),err=$('#nw-err');
  if(!name){err.textContent='Escribe el nombre del producto.';$('#nw-name').focus();return}
  if(isNaN(price)||price<=0){err.textContent='Escribe un precio en US$ mayor que cero.';$('#nw-price').focus();return}
  if(isNaN(stock)||stock<0){err.textContent='Escribe cuántas unidades hay disponibles.';$('#nw-stock').focus();return}
  err.textContent='';
  draft.products.unshift({id:uid(),name:name,cat:$('#nw-cat').value.trim()||'Otros',price:round2(price),stock:stock,desc:$('#nw-desc').value.trim(),img:newImg||''});
  ['#nw-name','#nw-cat','#nw-price','#nw-stock','#nw-desc'].forEach(function(s){$(s).value=''});
  newImg='';var t=$('#nw-thumb');t.hidden=true;t.removeAttribute('src');
  renderAdminList();markDirty();$('#nw-name').focus();toast('Producto agregado. Falta publicar los cambios.');
}

/* ---------- publish ---------- */
var HEAD_TOP='<title>SuperPiky Geek Store</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">';
var FALLBACK_RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
function buildDoc(state){
  var hs=document.head&&document.head.querySelector('style');
  var reset=(hs&&hs.textContent)||FALLBACK_RESET;
  var json=JSON.stringify(state).replace(/</g,'\\u003c').split(String.fromCharCode(8232)).join('\\u2028').split(String.fromCharCode(8233)).join('\\u2029');
  var S='<'+'script',E='<'+'/script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    +HEAD_TOP+'<style id="app-css">'+$('#app-css').textContent+'</style><div id="app"></div>'
    +S+' type="application/json" id="store-state">'+json+E
    +S+' id="app-js">'+$('#app-js').textContent+E+'</body></html>';
}
async function publish(){
  if(busy)return;
  if(!artifactNS){toast('Desde esta vista no se puede publicar.');return}
  var html=buildDoc(draft);
  if(html.length>15500000){toast('Las fotos pesan demasiado. Elimina algunas o usa imágenes más livianas.');return}
  busy=true;updateSavebar();
  try{sessionStorage.setItem('superpiky-published','1')}catch(e){}
  try{
    await artifactNS.publish(html);
  }catch(err){
    busy=false;
    try{sessionStorage.removeItem('superpiky-published')}catch(e){}
    var code=err&&err.code;
    if(code==='conflict')toast('Se publicó otra versión antes. La página se recargará; repite tus cambios.');
    else if(code==='not_writer'||code==='not_granted'||code==='capability_disabled'||code==='consent_required'){artifactNS=null;toast('Tu cuenta no puede publicar cambios en esta tienda.')}
    else if(code==='too_large')toast('La tienda quedó demasiado pesada. Elimina fotos o usa imágenes más livianas.');
    else if(code==='rate_limited')toast('Espera unos segundos y vuelve a publicar.');
    else toast('No se pudo publicar. Intenta de nuevo.');
    updateSavebar();
  }
}

/* ---------- toast ---------- */
var toastTimer=null;
function toast(msg){
  var t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},4500);
}

/* ---------- events ---------- */
function keepFocus(fn){
  var a=document.activeElement,act=a&&a.dataset&&a.dataset.act,id=a&&a.dataset&&a.dataset.id;
  var scope=a&&a.closest&&a.closest('#cart-body')?'#cart-body':'#grid';
  fn();
  if(!act||!id)return;
  var alt={add:'inc',inc:'inc',dec:'dec'};
  var el=$(scope+' [data-act="'+act+'"][data-id="'+id+'"]')||$(scope+' [data-act="'+(alt[act]||act)+'"][data-id="'+id+'"]')||$(scope+' [data-act="add"][data-id="'+id+'"]');
  if(el&&!el.disabled)el.focus();
}
function cartChanged(){saveCart();renderCartBtn();renderGrid();if(drawerOpen)renderCart()}
document.addEventListener('click',function(e){
  if(e.target.id==='drawer'){closeCart();return}
  var t=e.target.closest('[data-act]');
  var wasArmed=armed;
  if(!t){if(armed){armed=null;if(route()==='admin'&&access==='ok'){renderAdminList();updateSavebar()}}return}
  var act=t.dataset.act,id=t.dataset.id,p=id?find(id):null;
  if(armed&&!((act==='del'&&armed===id)||(act==='discard'&&armed==='discard'))){armed=null;if(route()==='admin'&&access==='ok'){renderAdminList();updateSavebar()}}
  switch(act){
    case 'add':case 'inc':
      if(!p)break;
      keepFocus(function(){var q=(+cart[id]||0)+1;if(q>p.stock){toast('Solo hay '+p.stock+' disponibles de este producto.');return}cart[id]=q;cartChanged()});break;
    case 'dec':
      keepFocus(function(){var q=(+cart[id]||0)-1;if(q<=0)delete cart[id];else cart[id]=q;cartChanged()});break;
    case 'rm':keepFocus(function(){delete cart[id];cartChanged()});break;
    case 'clear-cart':cart={};cartChanged();break;
    case 'open-cart':openCart();break;
    case 'close-cart':closeCart();break;
    case 'cat':filter.cat=t.dataset.cat||'';renderChips();renderGrid();break;
    case 'add-product':addProduct();break;
    case 'del':
      if(armed===id){armed=null;draft.products=draft.products.filter(function(x){return x.id!==id});delete cart[id];saveCart();renderAdminList();markDirty()}
      else{armed=id;renderAdminList();var db=$('[data-act="del"][data-id="'+id+'"]');if(db)db.focus()}
      break;
    case 'del-ex':
      draft.products=draft.products.filter(function(x){return !x.ex});cleanCart();renderAdminList();markDirty();break;
    case 'discard':
      if(armed==='discard'){armed=null;draft=clone(saved);dirty=false;renderAdmin()}
      else{armed='discard';updateSavebar()}
      break;
    case 'pub':publish();break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){filter.q=t.value;renderGrid();return}
  if(t.dataset&&t.dataset.order){order[t.dataset.order]=t.value;updateWa();return}
  if(t.id==='set-wa'){draft.shop.whatsapp=t.value;markDirty();return}
  if(t.id==='set-rate'){draft.shop.rate=parseFloat(String(t.value).replace(',','.'))||0;draft.shop.rateDate=todayISO();markDirty();draft.products.forEach(function(p){var b=$('[data-bsp="'+p.id+'"]');if(b)b.textContent=bsPreview(p)});return}
  var row=t.closest&&t.closest('.prow');
  if(row&&t.dataset.f){
    var p=find(row.dataset.id);if(!p)return;
    var f=t.dataset.f;
    if(f==='price')p.price=Math.max(0,parseFloat(String(t.value).replace(',','.'))||0);
    else if(f==='stock')p.stock=Math.max(0,parseInt(t.value,10)||0);
    else p[f]=t.value;
    p.ex=false;markDirty();
    if(f==='price'){var b=$('[data-bsp="'+p.id+'"]');if(b)b.textContent=bsPreview(p)}
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.matches&&t.matches('select[data-order]')){order[t.dataset.order]=t.value;updateWa();return}
  if(t.matches&&t.matches('input[type=file][data-photo]')){
    var f=t.files&&t.files[0];if(!f)return;
    fileToDataUrl(f).then(function(url){
      if(t.dataset.photo==='new'){newImg=url;var th=$('#nw-thumb');th.src=url;th.hidden=false}
      else{var p=find(t.dataset.photo);if(p){p.img=url;p.ex=false;renderAdminList();markDirty()}}
    }).catch(function(){toast('No se pudo leer esa imagen. Prueba con una foto JPG o PNG.')});
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&drawerOpen)closeCart()});

/* ---------- routing and boot ---------- */
function render(){
  document.documentElement.lang='es';
  if(drawerOpen){drawerOpen=false;document.body.style.overflow=''}
  if(route()==='admin')renderAdmin();else renderStore();
}
window.addEventListener('hashchange',function(){forced=null;render();window.scrollTo(0,0)});
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;
  var h=a.getAttribute('href');if(h!=='#admin'&&h!=='#tienda')return;
  e.preventDefault();forced=h==='#admin'?'admin':'store';
  try{location.hash=h}catch(err){}
  render();window.scrollTo(0,0);
});
render();
try{if(sessionStorage.getItem('superpiky-published')){sessionStorage.removeItem('superpiky-published');toast('Cambios publicados. Los clientes ya ven la tienda actualizada.')}}catch(e){}
(async function(){

    if(window.claude&&window.claude.use){
      var u=await window.claude.use('user');
      artifactNS=await window.claude.use('artifact');
      canEdit=u?await u.canEdit():false;
    }

  access=canEdit?'ok':'denied';
  if(route()==='admin')renderAdmin();else adminSlot();
})();
})();
